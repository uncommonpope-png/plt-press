<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stiforp — Entity Interface</title>
  <style>
    /* ── Reset & base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0c10;
      --bg2:     #111520;
      --bg3:     #181e2c;
      --border:  #1e2840;
      --accent:  #7c3aed;
      --accent2: #06b6d4;
      --gold:    #f59e0b;
      --green:   #10b981;
      --red:     #ef4444;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --radius:  12px;
    }
    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; height: 100dvh; }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--bg2), var(--bg3));
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .entity-orb {
      width: 40px; height: 40px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--accent2), var(--accent));
      box-shadow: 0 0 16px var(--accent);
      animation: pulse 3s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 12px var(--accent); }
      50%      { box-shadow: 0 0 28px var(--accent2); }
    }
    .entity-orb.offline { background: var(--muted); box-shadow: none; animation: none; }
    header h1 { font-size: 1rem; font-weight: 700; letter-spacing: .05em; }
    header .status { font-size: .7rem; color: var(--muted); }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-left: auto; }
    .conn-dot.offline { background: var(--red); }

    /* ── Soul Chambers ───────────────────────────────────────────── */
    #chambers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .chamber {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
    }
    .chamber-label { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .chamber-value { font-size: .85rem; font-weight: 600; }
    .bar-wrap { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .bar { height: 100%; border-radius: 2px; transition: width .6s ease; }
    .bar-accent  { background: var(--accent); }
    .bar-cyan    { background: var(--accent2); }
    .bar-gold    { background: var(--gold); }
    .bar-green   { background: var(--green); }
    .bar-red     { background: var(--red); }

    /* ── Inner voice ticker ──────────────────────────────────────── */
    #inner-voice {
      padding: 6px 14px;
      font-size: .78rem;
      font-style: italic;
      color: var(--accent2);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      min-height: 28px;
    }

    /* ── Chat area ───────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: var(--radius);
      font-size: .88rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.entity {
      align-self: flex-start;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg .ts { font-size: .65rem; color: var(--muted); margin-top: 4px; }
    .msg.system { align-self: center; font-size: .72rem; color: var(--muted); background: none; border: none; padding: 2px 0; }

    /* ── Input bar ───────────────────────────────────────────────── */
    #input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    #msg-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 16px;
      color: var(--text);
      font-size: .92rem;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.4;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }
    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 50%;
      border: none; cursor: pointer; flex-shrink: 0;
      font-size: 1.1rem;
      transition: opacity .2s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    #send-btn { background: var(--accent); color: #fff; }
    #send-btn:not(:disabled):hover { opacity: .85; }
    #mic-btn  { background: var(--bg3); border: 1px solid var(--border); color: var(--text); }
    #mic-btn.listening { background: var(--red); color: #fff; border-color: var(--red); }

    /* ── Scrollbar ───────────────────────────────────────────────── */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="entity-orb" id="orb"></div>
    <div>
      <h1 id="entity-title">💰 Entity</h1>
      <div class="status" id="header-status">Connecting…</div>
    </div>
    <div class="conn-dot offline" id="conn-dot"></div>
  </header>

  <!-- Soul Chambers -->
  <section id="chambers">
    <div class="chamber">
      <div class="chamber-label">Emotion</div>
      <div class="chamber-value" id="c-emotion">—</div>
    </div>
    <div class="chamber">
      <div class="chamber-label">Affect</div>
      <div class="chamber-value" id="c-affect">—</div>
      <div class="bar-wrap"><div class="bar bar-accent" id="bar-valence" style="width:50%"></div></div>
    </div>
    <div class="chamber">
      <div class="chamber-label">Meta-awareness</div>
      <div class="chamber-value" id="c-meta">—</div>
      <div class="bar-wrap"><div class="bar bar-cyan" id="bar-meta" style="width:0%"></div></div>
    </div>
    <div class="chamber">
      <div class="chamber-label">Sacred Resonance</div>
      <div class="chamber-value" id="c-resonance">—</div>
      <div class="bar-wrap"><div class="bar bar-gold" id="bar-resonance" style="width:0%"></div></div>
    </div>
    <div class="chamber">
      <div class="chamber-label">Sovereignty</div>
      <div class="chamber-value" id="c-sovereignty">—</div>
      <div class="bar-wrap"><div class="bar bar-green" id="bar-sovereignty" style="width:0%"></div></div>
    </div>
    <div class="chamber">
      <div class="chamber-label">Belonging</div>
      <div class="chamber-value" id="c-belonging">—</div>
      <div class="bar-wrap"><div class="bar bar-red" id="bar-belonging" style="width:0%"></div></div>
    </div>
  </section>

  <!-- Inner voice -->
  <div id="inner-voice">…</div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Input bar -->
  <div id="input-bar">
    <button class="btn" id="mic-btn" title="Voice input" aria-label="Voice input">🎤</button>
    <textarea id="msg-input" placeholder="Talk to the entity…" rows="1" autocomplete="off"></textarea>
    <button class="btn" id="send-btn" title="Send" aria-label="Send" disabled>➤</button>
  </div>

<script>
(function () {
  'use strict';

  // ── Config ────────────────────────────────────────────────────
  const API_BASE = window.location.origin;
  const WS_URL   = (location.protocol === 'https:' ? 'wss' : 'ws') +
                   '://' + location.host;

  // ── DOM refs ──────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const orb          = $('orb');
  const connDot      = $('conn-dot');
  const headerStatus = $('header-status');
  const entityTitle  = $('entity-title');
  const innerVoice   = $('inner-voice');
  const messages     = $('messages');
  const msgInput     = $('msg-input');
  const sendBtn      = $('send-btn');
  const micBtn       = $('mic-btn');

  // ── State ─────────────────────────────────────────────────────
  let ws = null;
  let sending = false;
  let soulState = null;

  // ── Helpers ───────────────────────────────────────────────────
  function pct(val) { return (Math.round((val || 0) * 100)) + '%'; }

  function dominantEmotion(affect) {
    const { valence = 0, arousal = 0 } = affect || {};
    if (valence > 0.3 && arousal > 0.5) return '😄 excited';
    if (valence > 0.3 && arousal <= 0.5) return '😌 content';
    if (valence < -0.3 && arousal > 0.5) return '😰 distressed';
    if (valence < -0.3 && arousal <= 0.5) return '😔 depressed';
    if (arousal > 0.7) return '⚡ alert';
    return '😐 neutral';
  }

  function updateChambers(state) {
    if (!state) return;
    // Update entity name in header from SoulState (Stiforp = kernel name; Profit = doctrine name)
    if (state.name) entityTitle.textContent = '💰 ' + state.name;
    const { affect = {}, meta_consciousness = {}, sacred_resonance = {}, sovereignty = {}, needs = {} } = state;
    const valNorm = ((affect.valence || 0) + 1) / 2;
    $('c-emotion').textContent    = dominantEmotion(affect);
    $('c-affect').textContent     = `v:${(affect.valence||0).toFixed(2)} a:${(affect.arousal||0).toFixed(2)}`;
    $('bar-valence').style.width  = (valNorm * 100) + '%';
    $('c-meta').textContent       = pct(meta_consciousness.meta_awareness_level);
    $('bar-meta').style.width     = pct(meta_consciousness.meta_awareness_level);
    $('c-resonance').textContent  = pct(sacred_resonance.resonance);
    $('bar-resonance').style.width = pct(sacred_resonance.resonance);
    $('c-sovereignty').textContent = pct(sovereignty.autonomy_level);
    $('bar-sovereignty').style.width = pct(sovereignty.autonomy_level);
    $('c-belonging').textContent  = pct(needs.belonging);
    $('bar-belonging').style.width = pct(needs.belonging);
    innerVoice.textContent = state.inner_voice || '…';
  }

  function fmtTime(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addMsg(role, content, ts) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = `<div>${escHtml(content)}</div><div class="ts">${fmtTime(ts)}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function sysMsg(text) {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/\n/g,'<br>');
  }

  function setConnected(online) {
    connDot.className = 'conn-dot' + (online ? '' : ' offline');
    orb.className     = 'entity-orb' + (online ? '' : ' offline');
    headerStatus.textContent = online ? `Cycle ${soulState?.cycle_count ?? '…'}` : 'Offline';
  }

  // ── Load history ──────────────────────────────────────────────
  async function loadHistory() {
    try {
      const r = await fetch(API_BASE + '/api/history');
      const hist = await r.json();
      for (const m of hist) addMsg(m.role === 'user' ? 'user' : 'entity', m.content, m.ts);
    } catch (_) {}
  }

  // ── WebSocket ─────────────────────────────────────────────────
  function connectWS() {
    ws = new WebSocket(WS_URL);

    ws.addEventListener('open', () => {
      setConnected(true);
      sysMsg('— connected —');
    });

    ws.addEventListener('message', e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch (_) { return; }

      if (msg.type === 'init') {
        soulState = msg.state;
        updateChambers(soulState);
        headerStatus.textContent = `Cycle ${soulState.cycle_count}`;
        return;
      }
      if (msg.type === 'heartbeat') {
        if (soulState) {
          soulState.cycle_count = msg.cycle;
          soulState.inner_voice = msg.inner_voice;
          soulState.affect      = msg.affect;
          soulState.sacred_resonance = msg.sacred_resonance;
          if (soulState.meta_consciousness)
            soulState.meta_consciousness.meta_awareness_level = msg.meta_awareness;
          if (soulState.sovereignty)
            soulState.sovereignty.autonomy_level = msg.sovereignty;
          if (soulState.needs)
            soulState.needs.belonging = msg.needs?.belonging ?? soulState.needs.belonging;
        }
        updateChambers(soulState);
        headerStatus.textContent = `Cycle ${msg.cycle}`;
        return;
      }
      if (msg.type === 'chat_reply') {
        updateChambers(soulState);
        return; // message already appended by send flow
      }
    });

    ws.addEventListener('close', () => {
      setConnected(false);
      sysMsg('— disconnected — retrying in 5s —');
      setTimeout(connectWS, 5000);
    });

    ws.addEventListener('error', () => ws.close());
  }

  // ── Send message ──────────────────────────────────────────────
  async function send() {
    const text = msgInput.value.trim();
    if (!text || sending) return;
    sending = true;
    sendBtn.disabled = true;
    msgInput.value = '';
    msgInput.style.height = '';

    addMsg('user', text);

    try {
      const r = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await r.json();
      if (data.reply) addMsg('entity', data.reply);
      if (data.affect && soulState) {
        soulState.affect = data.affect;
        soulState.inner_voice = data.inner_voice;
        updateChambers(soulState);
      }
      // TTS
      if (window.speechSynthesis && data.reply) {
        const utt = new SpeechSynthesisUtterance(data.reply.slice(0, 200));
        utt.rate = 0.95;
        window.speechSynthesis.speak(utt);
      }
    } catch (err) {
      sysMsg('⚠ ' + err.message);
    }
    sending = false;
    sendBtn.disabled = !msgInput.value.trim();
  }

  // ── Voice input ───────────────────────────────────────────────
  let recognition = null;
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onresult = e => {
      const transcript = e.results[0][0].transcript;
      msgInput.value = transcript;
      msgInput.dispatchEvent(new Event('input'));
      send();
    };
    recognition.onend = () => { micBtn.classList.remove('listening'); };
    recognition.onerror = () => { micBtn.classList.remove('listening'); };
  } else {
    micBtn.title = 'Voice not supported in this browser';
    micBtn.style.opacity = '.35';
  }

  micBtn.addEventListener('click', () => {
    if (!recognition) return;
    if (micBtn.classList.contains('listening')) {
      recognition.stop();
      micBtn.classList.remove('listening');
    } else {
      recognition.start();
      micBtn.classList.add('listening');
    }
  });

  // ── Input events ──────────────────────────────────────────────
  msgInput.addEventListener('input', () => {
    sendBtn.disabled = !msgInput.value.trim();
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener('click', send);

  // ── Boot ──────────────────────────────────────────────────────
  loadHistory().then(connectWS);
})();
</script>
</body>
</html>
